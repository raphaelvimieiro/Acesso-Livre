<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcessoLive</title>

<!-- CSS -->

<link rel="stylesheet" href="/codigo-fonte/Cadastro/Cadastro.css">

<!-- Font Awesome (ícones do olho) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
    <h1 class="logo-header" onclick="window.location.href='/codigo-fonte/inicio/inicio.html'">Acesso<span class="livre-text">Livre</span></h1>
    <nav>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
      <ul class="menu">
        <li >
          <a href="/codigo-fonte/Inicio/inicio.html">Início</a>
          
        </li>
        <li><a href="/codigo-fonte/Sobre/sobre.html">Sobre</a></li>
        <li><a href="/codigo-fonte/Noticias/noticias.html">Notícia</a></li>
        <li><a href="/codigo-fonte/Denúncia/Deslogado/Denuncia-deslogado.html">Denúncia</a></li> <!-- precisar linkar para a página de denúncia logado --> 
      </ul>
    </nav>
    <div class="Pesquisa-Login">
      <div class="box-lateral">
        <input type="text" name="Busca" required placeholder="Buscar locais, bairros..." />
        <img onclick="window.location.href='../Pesquisa/searchNL.html'" class="lupa-icon" src="../Imagens/lupa.png" alt="Ícone de lupa" />
      </div>
      <button class="btn-user">Entrar</button>
    </div>
  </header>

<main>
  <form class="form-box" id="form">

    <h2>Cadastre-<span>se</span></h2>

    <div class="row">
      <div class="input-group">
        <label>NOME</label>
        <input type="text" required>
      </div>

      <div class="input-group">
        <label>SOBRENOME</label>
        <input type="text" required>
      </div>
    </div>

    <div class="input-group">
      <label for="email">E-MAIL</label>
<input type="email" id="email" required>
    </div>

    <div class="input-group">
      <label for="telefone">TELEFONE</label>
      <input type="text" id="telefone" required>
    </div>

    <div class="input-group password">
      <label>SENHA</label>
      <input type="password" id="senha" required>
      <i class="fa-regular fa-eye toggle"></i>
    </div>

    <div class="input-group password">
      <label>CONFIRMAR SENHA</label>
      <input type="password" id="confirmar" required>
      <i class="fa-regular fa-eye toggle"></i>
    </div>

    <div class="checkbox">
      <input type="checkbox" required>
      <span>Concordo com os <a href="#">Termos</a> e <a href="#">Privacidade</a></span>
    </div>

    <button class="submit">Criar conta</button>

    <p>Já tem uma conta? <a href="/codigo-fonte/Pagina-Login/Login.html">Faça login</a></p>

  </form>
</main>

<script>
// Mostrar/ocultar senha
document.querySelectorAll(".toggle").forEach(icon => {
  icon.addEventListener("click", () => {
    const input = icon.previousElementSibling;

    if (input.type === "password") {
      input.type = "text";
      icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
      input.type = "password";
      icon.classList.replace("fa-eye-slash", "fa-eye");
    }
  });
});

// Validação
document.getElementById("form").addEventListener("submit", function(e) {
  const senha = document.getElementById("senha").value;
  const confirmar = document.getElementById("confirmar").value;
  const email = document.getElementById("email").value;

  if (senha.length < 8) {
    alert("A senha precisa ter pelo menos 8 caracteres");
    e.preventDefault();
  }

  if (senha !== confirmar) {
    alert("As senhas não coincidem");
    e.preventDefault();
  }

  if (!email.includes("@")) {
    alert("E-mail inválido");
    e.preventDefault();
  }
});
</script>

</body>
<footer class="footer">
      <div class="footer-content">
        <p>© 2026 AcessoLivre. Todos os direitos reservados.</p>

      </div>
    </footer>
</html>
