<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcessoLive</title>

<!-- CSS -->
<link rel="stylesheet" href="/codigo-fonte/Cadastro/login.css">
<link rel="stylesheet" href="/codigo-fonte/Cadastro/Cadastro.css">

<!-- Font Awesome (ícones do olho) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
  <h1>Acesso <span>Livre</span></h1>
  
  <nav class="nav">
    <a href="#">Início</a>
    <a href="#">Sobre</a>
    <a href="#">Notícias</a>
    <a href="#">Denúncias</a>
  </nav>

  <div class="right">
    <div class="search-box">
  <input type="text" placeholder="Buscar...">
  
  <button>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
      <circle cx="11" cy="11" r="7" stroke="#000" stroke-width="2"/>
      <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="#000" stroke-width="2"/>
    </svg>
  </button>
</div>
</header>

<main>
  <form class="form-box" id="form">

    <h2>Cadastre-<span>se</span></h2>

    <div class="row">
      <div class="input-group">
        <label>NOME</label>
        <input type="text" required>
      </div>

      <div class="input-group">
        <label>SOBRENOME</label>
        <input type="text" required>
      </div>
    </div>

    <div class="input-group">
      <label for="email">E-MAIL</label>
<input type="email" id="email" required>
    </div>

    <div class="input-group">
      <label for="telefone">TELEFONE</label>
      <input type="text" id="telefone" required>
    </div>

    <div class="input-group password">
      <label>SENHA</label>
      <input type="password" id="senha" required>
      <i class="fa-regular fa-eye toggle"></i>
    </div>

    <div class="input-group password">
      <label>CONFIRMAR SENHA</label>
      <input type="password" id="confirmar" required>
      <i class="fa-regular fa-eye toggle"></i>
    </div>

    <div class="checkbox">
      <input type="checkbox" required>
      <span>Concordo com os <a href="#">Termos</a> e <a href="#">Privacidade</a></span>
    </div>

    <button class="submit">Criar conta</button>

    <p>Já tem uma conta? <a href="/codigo-fonte/Pagina-Login/Login.html">Faça login</a></p>

  </form>
</main>

<script>
// Mostrar/ocultar senha
document.querySelectorAll(".toggle").forEach(icon => {
  icon.addEventListener("click", () => {
    const input = icon.previousElementSibling;

    if (input.type === "password") {
      input.type = "text";
      icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
      input.type = "password";
      icon.classList.replace("fa-eye-slash", "fa-eye");
    }
  });
});

// Validação
document.getElementById("form").addEventListener("submit", function(e) {
  const senha = document.getElementById("senha").value;
  const confirmar = document.getElementById("confirmar").value;
  const email = document.getElementById("email").value;

  if (senha.length < 8) {
    alert("A senha precisa ter pelo menos 8 caracteres");
    e.preventDefault();
  }

  if (senha !== confirmar) {
    alert("As senhas não coincidem");
    e.preventDefault();
  }

  if (!email.includes("@")) {
    alert("E-mail inválido");
    e.preventDefault();
  }
});
</script>

</body>
</html>
