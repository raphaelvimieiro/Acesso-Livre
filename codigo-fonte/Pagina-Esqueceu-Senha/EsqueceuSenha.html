<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
  <title>Recuperar Senha</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Baloo+Tamma+2:wght@400..800&family=Baloo+Thambi+2:wght@400..800&family=Faustina:ital,wght@0,300..800;1,300..800&family=Fjalla+One&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Work+Sans&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=info" />
  <link rel="stylesheet" href="./EsqueceuSenha.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/codigo-fonte/header.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

  <nav class="navbar navbar-expand-lg bg-body-tertiary header p-4">
    <div class="container-fluid">

      <h1 class="logo-header m-0" onclick="window.location.href='/codigo-fonte/inicio/inicio.html'">
        Acesso<span class="livre-text">Livre</span>
      </h1>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse w-100" id="navbarSupportedContent">

        <ul class="navbar-nav gap-4 text-center">
          <li class="nav-item menu-li">
            <a class="nav-link menu-li" href="/codigo-fonte/Inicio/inicio.html">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link menu-li" href="/codigo-fonte/Sobre/sobre.html">Sobre</a>
          </li>
          <li class="nav-item">
            <a class="nav-link menu-li" href="/codigo-fonte/Noticias/noticias.html">Notícia</a>
          </li>
          <li class="nav-item">
            <a class="nav-link menu-li" href="/codigo-fonte/Denúncia/Deslogado/Denuncia-deslogado.html">Denúncia</a>
          </li>
        </ul>

        <div
          class="Pesquisa-Login d-flex flex-column flex-sm-row gap-3 align-items-center justify-content-center ms-lg-auto mt-4 mt-lg-0">
          <form class="d-flex gap-3 m-0" role="search">
            <input type="text" class="w-100" name="Busca" required placeholder="Buscar locais, bairros..." onclick="window.location.href='/codigo-fonte/Pesquisa/searchNL.html'"/>
          </form>
          <button class="btn btn-user btn-outline-success"
            onclick="window.location.href='../Pagina-Login/Login.html'">Entrar/Criar conta</button>
        </div>

      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main>

    <div class="card">

      <h2>
        Recuperar <span>senha</span>
      </h2>

      <!-- EMAIL -->
<div class="form-group">

  <label for="email">E-mail:</label>

  <div class="email-box">

    <input
      type="email"
      id="email"
      placeholder="Digite seu e-mail"
      required
    >

  </div>

</div>

      <!-- NOVA SENHA -->
      <div class="form-group">

        <label>Digite a nova senha:</label>

        <div class="password-box">

          <input type="password" id="novaSenha" placeholder="Nova senha">

          <span class="eye" onclick="toggleSenha('novaSenha', this)">
            👁
          </span>

        </div>

      </div>

      <!-- CONFIRMAR -->
      <div class="form-group">

        <label>Confirmar senha:</label>

        <div class="password-box">

          <input type="password" id="confirmarSenha" placeholder="Confirmar senha">

          <span class="eye" onclick="toggleSenha('confirmarSenha', this)">
            👁
          </span>

        </div>

      </div>

      <!-- BOTÃO -->
      <button onclick="recuperarSenha()">
        Recuperar
      </button>

      <!-- MENSAGEM -->
      <p id="mensagem"></p>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 AcessoLivre. Todos os direitos reservados.</p>
  </footer>

  <!-- JS -->
  <script defer src="./EsqueceuSenha.js"></script>

</body>

</html>
