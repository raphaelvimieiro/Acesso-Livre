<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Recuperar Senha</title>

  <link rel="stylesheet" href="./EsqueceuSenha.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <h1 class="logo-header"
      onclick="window.location.href='/codigo-fonte/inicio/inicio.html'">
      Acesso<span class="livre-text">Livre</span>
    </h1>
    <button class="menu-toggle" onclick="toggleMenu()">
  ☰
</button>

    <nav id="mobileMenu">

  <ul class="menu">

    <li>
      <a href="/codigo-fonte/Inicio/inicio.html">
        Início
      </a>
    </li>

    <li>
      <a href="/codigo-fonte/Sobre/sobre.html">
        Sobre
      </a>
    </li>

    <li>
      <a href="/codigo-fonte/Noticias/noticias.html">
        Notícia
      </a>
    </li>

    <li>
      <a href="/codigo-fonte/Denúncia/Deslogado/Denuncia-deslogado.html">
        Denúncia
      </a>
    </li>

  </ul>

</nav>
    <div class="Pesquisa-Login">

      <div class="box-lateral">

        <input
          type="text"
          placeholder="Buscar locais, bairros..."
        >

        <img
          class="lupa-icon"
          src="../Imagens/lupa.png"
          alt="Ícone de lupa"
        >

      </div>

      <button class="btn-user" onclick="window.location.href='/codigo-fonte/Pagina-Login/Login.html'">
        Entrar/Criar conta
      </button>

    </div>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  </header>

  <!-- MAIN -->
  <main>

    <div class="card">

      <h2>
        Recuperar <span>senha</span>
      </h2>

      <!-- NOVA SENHA -->
<div class="form-group">

  <label>Digite a nova senha:</label>

  <div class="password-box">

    <input
      type="password"
      id="novaSenha"
      placeholder="Nova senha"
    >

    <i
      class="fa-regular fa-eye eye"
      onclick="toggleSenha('novaSenha', this)"
    ></i>

  </div>

</div>

<!-- CONFIRMAR -->
<div class="form-group">

  <label>Confirmar senha:</label>

  <div class="password-box">

    <input
      type="password"
      id="confirmarSenha"
      placeholder="Confirmar senha"
    >

    <i
      class="fa-regular fa-eye eye"
      onclick="toggleSenha('confirmarSenha', this)"
    ></i>

  </div>

</div>

      <!-- BOTÃO -->
      <button onclick="recuperarSenha()">
        Recuperar
      </button>

      <!-- MENSAGEM -->
      <p id="mensagem"></p>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 AcessoLivre. Todos os direitos reservados.</p>
  </footer>

  <!-- JS -->
  <script defer src="./EsqueceuSenha.js"></script>

</body>
</html>
